<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yetkilendirme — Serra Bilişim</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#0f766e" />

  <link rel="stylesheet" href="../../styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2314b8a6'/><stop offset='1' stop-color='%230f766e'/></linearGradient></defs><rect width='100' height='100' rx='24' fill='url(%23g)'/><text x='50' y='69' font-size='50' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>S</text></svg>" />

  <style>
    /* Bu sayfa bilerek tek basina durur: script.js yuklenmez, cunku
       URL'de yetkilendirme kodu tasiniyor ve olcum servisine gitmemeli. */
    .cb { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .cb__card {
      width: 100%; max-width: 560px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: clamp(28px, 5vw, 44px);
      box-shadow: var(--shadow);
    }
    .cb__mark {
      display: grid; place-items: center; width: 52px; height: 52px;
      border-radius: 15px; font-weight: 800; font-size: 22px; color: #fff;
      background: linear-gradient(135deg, #14b8a6, #0f766e); margin-bottom: 22px;
    }
    .cb__state { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700;
      letter-spacing: 1.1px; text-transform: uppercase; }
    .cb__state--ok { color: #16a34a; }
    .cb__state--err { color: #dc2626; }
    .cb__state--wait { color: var(--text-soft); }
    .cb__dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
    .cb h1 { font-size: clamp(21px, 3.4vw, 27px); margin-top: 14px; }
    .cb p { margin-top: 12px; color: var(--text-soft); font-size: 15px; line-height: 1.65; }
    .cb__field { margin-top: 22px; }
    .cb__label { font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-soft); }
    .cb__val {
      margin-top: 7px; display: flex; gap: 8px; align-items: flex-start;
      background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
    }
    .cb__val code {
      flex: 1; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px; word-break: break-all; color: var(--text);
    }
    .cb__copy {
      flex: none; border: 1px solid var(--border); background: var(--surface); color: var(--text-soft);
      border-radius: 9px; padding: 6px 11px; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
      transition: color 0.18s ease, border-color 0.18s ease;
    }
    .cb__copy:hover { color: var(--accent); border-color: var(--accent); }
    .cb__note {
      margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border);
      font-size: 13.5px; color: var(--text-soft);
    }
    .cb__actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
  </style>
</head>
<body>
  <script>
    // Tema, script.js olmadan da dogru gelsin
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", saved || (dark ? "dark" : "light"));
    })();
  </script>

  <main class="cb">
    <div class="cb__card">
      <div class="cb__mark">S</div>
      <span class="cb__state cb__state--wait" id="state"><span class="cb__dot"></span><span id="stateText">İşleniyor</span></span>
      <h1 id="title">Yetkilendirme yanıtı alınıyor</h1>
      <p id="desc">Bu sayfa, bağlandığınız servisten dönen yetkilendirme yanıtını karşılar.</p>

      <div id="fields"></div>

      <div class="cb__actions">
        <a class="btn btn--ghost btn--sm" href="../../index.html">Serra Bilişim'e dön</a>
      </div>

      <p class="cb__note" id="note"></p>
    </div>
  </main>

  <script>
  (function () {
    /* =====================================================================
       AYAR — popup akisi kullaniyorsan uygulamanin origin'ini buraya yaz.
       Bos birakilirsa kod hicbir yere gonderilmez, sadece ekranda gosterilir.
       Ornek: var POST_TO = "https://panora.sirketiniz.com";
       ===================================================================== */
    var POST_TO = "";

    var q = new URLSearchParams(location.search);
    // Implicit flow'da degerler fragment'ta gelir
    var h = new URLSearchParams((location.hash || "").replace(/^#/, ""));
    var get = function (k) { return q.get(k) || h.get(k); };

    var code = get("code");
    var state = get("state");
    var token = get("access_token");
    var err = get("error");
    var errDesc = get("error_description");

    var $ = function (id) { return document.getElementById(id); };

    var show = function (kind, badge, title, desc) {
      $("state").className = "cb__state cb__state--" + kind;
      $("stateText").textContent = badge;
      $("title").textContent = title;
      $("desc").textContent = desc;
    };

    var field = function (label, value) {
      if (!value) return;
      var wrap = document.createElement("div");
      wrap.className = "cb__field";
      var l = document.createElement("div");
      l.className = "cb__label";
      l.textContent = label;
      var v = document.createElement("div");
      v.className = "cb__val";
      var c = document.createElement("code");
      c.textContent = value;
      var b = document.createElement("button");
      b.className = "cb__copy";
      b.type = "button";
      b.textContent = "Kopyala";
      b.addEventListener("click", function () {
        navigator.clipboard.writeText(value).then(
          function () { b.textContent = "Kopyalandı"; setTimeout(function () { b.textContent = "Kopyala"; }, 1600); },
          function () { b.textContent = "Kopyalanamadı"; }
        );
      });
      v.appendChild(c); v.appendChild(b);
      wrap.appendChild(l); wrap.appendChild(v);
      $("fields").appendChild(wrap);
    };

    if (err) {
      show("err", "Reddedildi", "Yetkilendirme tamamlanmadı", errDesc || "Servis yetkilendirme talebini reddetti.");
      field("Hata kodu", err);
      field("state", state);
      $("note").textContent = "İşlemi baştan başlatabilir ya da bu pencereyi kapatabilirsiniz.";
      return;
    }

    if (!code && !token) {
      show("err", "Eksik yanıt", "Yetkilendirme bilgisi bulunamadı", "Bu adrese doğrudan girdiyseniz beklenen budur. Sayfa yalnızca bir servisten yönlendirildiğinde anlamlı çalışır.");
      $("note").textContent = "Yetkilendirme akışını uygulamanın kendi ekranından başlatın.";
      return;
    }

    show("ok", "Başarılı", "Yetkilendirme onaylandı", "Aşağıdaki bilgiyi isteyen uygulamaya iletin. Bu değer kısa ömürlüdür ve tek kullanımlıktır.");
    field("Yetkilendirme kodu", code);
    field("access_token", token);
    field("state", state);

    // Popup akisi: yalnizca acikca ayarlanmis bir origin'e gonder
    var sent = false;
    if (POST_TO && window.opener) {
      try {
        window.opener.postMessage({ source: "serra-oauth", code: code, state: state, access_token: token }, POST_TO);
        sent = true;
      } catch (e) {}
    }

    $("note").textContent = sent
      ? "Kod uygulamaya iletildi, bu pencereyi kapatabilirsiniz."
      : "Bu kodu kimseyle paylaşmayın. Kodu token'a çevirme adımı, istemci gizli anahtarı gerektirdiği için sunucu tarafında yapılmalıdır.";

    // Kod adres cubugunda ve gecmiste kalmasin
    try { history.replaceState(null, "", location.pathname); } catch (e) {}
  })();
  </script>
</body>
</html>
